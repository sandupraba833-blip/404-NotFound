<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <style>
        /* 404 Page */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .page_404 {
            min-height: 100vh;
            padding: 40px 15px;
            background: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .four_zero_four_bg {
            background-image: url(
                https://cdn.dribbble.com/users/285475/screenshots/2083086/dribbble_1.gif
            );

            height: 400px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
        }

        .four_zero_four_bg h1 {
            font-size: 80px;
            padding-top: 20px;
        }

        .contant_box_404 {
            margin-top: -40px;
        }

        .contant_box_404 h3 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .contant_box_404 p {
            color: #666;
            margin-bottom: 25px;
        }

        /* Back Button */

        .link_404 {
            color: #fff;
            background: #39ac31;
            padding: 13px 30px;
            display: inline-block;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .link_404:hover {
            background: #267d20;
            transform: scale(1.05);
        }

    </style>
</head>

<body>

<section class="page_404">

    <div class="container">

        <div class="four_zero_four_bg">

            <h1>404</h1>

        </div>

        <div class="contant_box_404">

            <h3>Look like you're lost</h3>

            <p>
                The page you are looking for is not available!
            </p>

            <a href="index.php" class="link_404">
                ← BACK TO HOME
            </a>

        </div>

    </div>

</section>

</body>
</html>
